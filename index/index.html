<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>lanches do vini – Delivery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Link do CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="bar">
        <div class="logo">Lanches do vini</div>
        <div class="tabs" role="tablist">
          <button class="tab">
            <a class="tab" href="admin.html"> Admin</a>
          </button>

          <button class="tab" role="tab" data-v="menu" aria-selected="true">
            Cardápio
          </button>
          <button class="tab" role="tab" data-v="orders" aria-selected="false">
            Meus pedidos
          </button>
        </div>
        <button class="cartbtn" id="openCart">
          Carrinho (<span id="cnt">0</span>)
        </button>
      </div>
    </header>

    <main>
      <section class="view" id="v-menu">
        <h1 style="margin-bottom: 12px">O que você quer pedir hoje?</h1>
        <div class="cats" id="cats"></div>
        <div class="grid" id="grid"></div>
      </section>
      <section class="view" id="v-orders" hidden>
        <h2 style="margin-bottom: 12px">Meus pedidos</h2>
        <div id="myOrders"></div>
      </section>
    </main>

    <div class="scrim" id="scrim" hidden></div>
    <aside id="cart" aria-label="Carrinho">
      <div class="ahead">
        <h2>Seu pedido</h2>
        <button class="chip" id="closeCart">Fechar</button>
      </div>
      <div class="abody">
        <div id="lines"></div>
        <div id="form">
          <label for="nome">Nome</label><input id="nome" autocomplete="name" />
          <label for="tel">Telefone</label
          ><input id="tel" type="tel" autocomplete="tel" />
          <label for="end">Endereço de entrega</label
          ><input id="end" autocomplete="street-address" />
          <label for="pag">Pagamento</label>
          <select id="pag">
            <option>Pix</option>
            <option>Dinheiro</option>
            <option>Cartão Débito</option>
            <option>Cartão Crédito</option>
          </select>
          <label for="obs">Observações</label
          ><textarea id="obs" rows="2"></textarea>
        </div>
      </div>
      <div class="afoot">
        <div class="sum"><span>Subtotal</span><span id="sub"></span></div>
        <div class="sum">
          <span>Taxa de entrega</span><span id="fee"></span>
        </div>
        <div class="sum total"><span>Total</span><span id="tot"></span></div>
        <button class="go" id="send" disabled>Fazer pedido</button>
      </div>
    </aside>
    <div class="toast" id="toast" hidden></div>

    <!-- Link do JavaScript (fica no final do body) -->
    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
