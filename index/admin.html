<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Painel do vendedor</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- TELA DE LOGIN -->
    <section id="login" class="loginbox">
      <form id="loginForm">
        <h1>Área do vendedor</h1>
        <p style="color: var(--muted); margin: 6px 0 0">Acesso restrito.</p>
        <label for="pass">Senha</label>
        <input
          id="pass"
          type="password"
          autocomplete="current-password"
          required
        />
        <p id="err" class="err" role="alert"></p>
        <button class="go" type="submit">Entrar</button>
      </form>
    </section>

    <!-- PAINEL (só aparece depois do login) -->
    <div id="panel" hidden>
      <header>
        <div class="bar">
          <div class="logo">Painel do vendedor</div>
          <div class="tabs" role="tablist">
            <button class="tab" role="tab" data-t="orders" aria-selected="true">
              Pedidos
            </button>
            <button class="tab" role="tab" data-t="menu" aria-selected="false">
              Cardápio
            </button>
          </div>
          <button class="chip" id="logout">Sair</button>
        </div>
      </header>

      <main>
        <section class="view" id="t-orders">
          <div class="stats" id="stats"></div>
          <div class="kan" id="kan"></div>
        </section>

        <section class="view" id="t-menu" hidden>
          <h2 style="margin-bottom: 10px">Adicionar item</h2>
          <form id="addForm" class="formgrid">
            <div>
              <label for="fn">Nome</label
              ><input id="fn" required maxlength="50" />
            </div>
            <div>
              <label for="fp">Preço (R$)</label
              ><input id="fp" type="number" step="0.01" min="0.01" required />
            </div>
            <div>
              <label for="fc">Categoria</label
              ><input id="fc" list="catlist" required maxlength="30" /><datalist
                id="catlist"
              ></datalist>
            </div>
            <div>
              <label for="fe">Emoji</label
              ><input id="fe" maxlength="4" placeholder="🍽️" />
            </div>
            <div class="full">
              <label for="fd">Descrição</label><input id="fd" maxlength="120" />
            </div>
            <div class="full">
              <button class="go" type="submit" style="margin-top: 0">
                Adicionar ao cardápio
              </button>
            </div>
          </form>

          <div class="row" style="margin: 24px 0 10px">
            <h2>Itens do cardápio</h2>
            <button class="chip" id="resetMenu">
              Restaurar cardápio padrão
            </button>
          </div>
          <div class="tablewrap"><table id="menuTable"></table></div>
        </section>
      </main>
    </div>
    <div class="toast" id="toast" hidden></div>

    <script src="data.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
